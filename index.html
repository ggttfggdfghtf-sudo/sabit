<!doctype html>
<html lang="ru" data-pwa>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стоматология | Экзаменатор</title>
<meta name="description" content="Тренажёр для подготовки к экзамену по специальности «Стоматология профилактическая»: 300 тестовых заданий, режимы экзамена и тренировки, работа над ошибками.">
<meta name="theme-color" content="#F7F9FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C111B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Экзаменатор">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: single column dashboard of mode cards; test screen = question column + sticky status rail on desktop, bottom thumb bar on phone */
:root {
  --bg: #F7F9FC;
  --surface: #FFFFFF;
  --surface-2: #F1F4F9;
  --border: #E3E8F0;
  --border-strong: #CBD4E1;
  --text: #172033;
  --muted: #64748B;
  --faint: #94A3B8;
  --accent: #2563EB;
  --accent-hover: #1D4ED8;
  --accent-soft: #EAF1FE;
  --accent-ink: #1E40AF;
  --on-accent: #FFFFFF;
  --teal: #14B8A6;
  --teal-soft: #E7F7F5;
  --teal-ink: #0F766E;
  --ok: #16A34A;
  --ok-soft: #EBF7EF;
  --ok-border: #A3DCB8;
  --ok-ink: #166534;
  --bad: #DC2626;
  --bad-soft: #FDEFEF;
  --bad-border: #F2B5B1;
  --bad-ink: #9F1D1D;
  --warn: #D97706;
  --warn-soft: #FEF6E8;
  --warn-border: #F2D19C;
  --warn-ink: #8A4209;
  --scrim: rgba(15, 23, 42, .42);
  --shadow: 0 1px 2px rgba(23, 32, 51, .04), 0 6px 20px rgba(23, 32, 51, .05);
  --shadow-lg: 0 18px 50px rgba(23, 32, 51, .18);
  --radius: 18px;
  --radius-sm: 12px;
  --font: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --dur: .18s;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C111B; --surface: #131A27; --surface-2: #1A2334; --border: #243047; --border-strong: #34425C;
    --text: #E7ECF4; --muted: #95A3BA; --faint: #6B7891;
    --accent: #5B8DF6; --accent-hover: #7BA3F8; --accent-soft: #172846; --accent-ink: #AFC8FB; --on-accent: #0B1220;
    --teal: #2CC9B5; --teal-soft: #0F2E2C; --teal-ink: #84E4D7;
    --ok: #46C27A; --ok-soft: #10291C; --ok-border: #275A3D; --ok-ink: #95E2B4;
    --bad: #F07171; --bad-soft: #321618; --bad-border: #6E2C30; --bad-ink: #F7ADAD;
    --warn: #E9A645; --warn-soft: #2D2210; --warn-border: #6A4B1B; --warn-ink: #F3CB8B;
    --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .2);
    --shadow-lg: 0 18px 50px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C111B; --surface: #131A27; --surface-2: #1A2334; --border: #243047; --border-strong: #34425C;
  --text: #E7ECF4; --muted: #95A3BA; --faint: #6B7891;
  --accent: #5B8DF6; --accent-hover: #7BA3F8; --accent-soft: #172846; --accent-ink: #AFC8FB; --on-accent: #0B1220;
  --teal: #2CC9B5; --teal-soft: #0F2E2C; --teal-ink: #84E4D7;
  --ok: #46C27A; --ok-soft: #10291C; --ok-border: #275A3D; --ok-ink: #95E2B4;
  --bad: #F07171; --bad-soft: #321618; --bad-border: #6E2C30; --bad-ink: #F7ADAD;
  --warn: #E9A645; --warn-soft: #2D2210; --warn-border: #6A4B1B; --warn-ink: #F3CB8B;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .2);
  --shadow-lg: 0 18px 50px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 15px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }
svg.i.lg { width: 24px; height: 24px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }

.wrap {
  width: 100%; max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-weight: 550; font-size: 14.5px; white-space: nowrap;
  transition: background var(--dur), border-color var(--dur), color var(--dur), transform var(--dur), box-shadow var(--dur);
}
.btn:hover { border-color: var(--border-strong); background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad-ink); border-color: var(--bad-border); background: var(--bad-soft); }
.btn.danger:hover { border-color: var(--bad); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.icon { padding: 0; width: 44px; }
.btn.sm.icon { width: 36px; }
.btn.on { color: var(--accent-ink); background: var(--accent-soft); border-color: transparent; }

/* ---------- Top header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid transparent;
}
.top.scrolled { border-bottom-color: var(--border); }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: inherit; background: none; border: 0; padding: 0; }
.mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); flex: none; }
.mark svg { width: 20px; height: 20px; }
.brand b { font-weight: 650; font-size: 15.5px; white-space: nowrap; }
.brand b span { color: var(--muted); font-weight: 450; }
.top nav { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.top nav .lbl { display: none; }
@media (min-width: 720px) { .top nav .lbl { display: inline; } .top nav .btn.icon.withlbl { width: auto; padding: 0 12px; } }

main { padding-block: 8px 48px; }

/* ---------- Dashboard ---------- */
.hero { display: grid; gap: 20px; padding-block: 18px 22px; }
.hero h1 { font-size: clamp(26px, 4.4vw, 34px); line-height: 1.15; }
.hero p.sub { color: var(--muted); font-size: 16px; margin-top: 6px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--teal-ink); }

.continue {
  display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  padding: 16px 18px; border-radius: var(--radius); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
}
.continue .txt { flex: 1 1 240px; min-width: 0; }
.continue b { display: block; font-weight: 620; }
.continue .bar { margin-top: 8px; }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 860px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; min-width: 0; }
.stat .k { font-size: 12.5px; color: var(--muted); }
.stat .v { font-size: 24px; font-weight: 650; line-height: 1.25; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 14px; color: var(--muted); font-weight: 500; }
.stat .d { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.bar > i.ok { background: var(--ok); border-radius: 0; }
.bar > i.bad { background: var(--bad); border-radius: 0; }
.bar > i.teal { background: var(--teal); }

.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 30px 0 12px; }
.section-h h2 { font-size: 18px; }

.modes { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .modes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 980px) { .modes { grid-template-columns: repeat(6, minmax(0, 1fr)); } .modes .mode { grid-column: span 2; } .modes .mode.wide { grid-column: span 3; } }
.mode {
  position: relative; display: flex; flex-direction: column; gap: 10px; text-align: left;
  padding: 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border);
  box-shadow: var(--shadow); color: inherit; min-width: 0;
  transition: border-color var(--dur), transform var(--dur), box-shadow var(--dur);
}
.mode:hover { border-color: var(--border-strong); transform: translateY(-2px); }
.mode .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); }
.mode.t-teal .ic { background: var(--teal-soft); color: var(--teal-ink); }
.mode.t-bad .ic { background: var(--bad-soft); color: var(--bad-ink); }
.mode.t-warn .ic { background: var(--warn-soft); color: var(--warn-ink); }
.mode h3 { font-size: 16.5px; }
.mode p { color: var(--muted); font-size: 14px; flex: 1; }
.mode .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13.5px; }
.mode .cta { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 600; }
.mode.featured { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.mode.featured p, .mode.featured .foot .muted { color: color-mix(in srgb, var(--on-accent) 80%, transparent); }
.mode.featured .ic { background: color-mix(in srgb, var(--on-accent) 16%, transparent); color: var(--on-accent); }
.mode.featured .cta { color: var(--on-accent); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; font-size: 12.5px; font-weight: 550; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok-ink); }
.pill.bad { background: var(--bad-soft); color: var(--bad-ink); }
.pill.warn { background: var(--warn-soft); color: var(--warn-ink); }
.pill.acc { background: var(--accent-soft); color: var(--accent-ink); }
.pill.teal { background: var(--teal-soft); color: var(--teal-ink); }

.panels { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .panels { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; min-width: 0; }
.panel h3 { font-size: 15px; margin-bottom: 12px; }
.empty { display: grid; justify-items: start; gap: 10px; padding: 8px 0; color: var(--muted); }
.empty .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--faint); }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--border); stroke-width: 1; }
.chart .axis { fill: var(--faint); font-size: 11px; font-family: var(--font); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: .09; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .dot.end { fill: var(--accent); }
.chart .endlbl { fill: var(--text); font-size: 12px; font-weight: 650; font-family: var(--font); }

.rows { display: grid; }
.row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); min-width: 0; }
.row:first-child { border-top: 0; padding-top: 0; }
.row .t { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row button.t { background: none; border: 0; padding: 0; text-align: left; }
.row button.t:hover { color: var(--accent); }
.qn { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; min-width: 40px; }

.note { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--muted); margin-top: 28px; }
.note svg { margin-top: 2px; }

/* ---------- Test screen ---------- */
.tbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--border); }
.tbar .wrap { display: flex; align-items: center; gap: 10px; min-height: 60px; }
.tbar .title { min-width: 0; flex: 1; }
.tbar .title b { display: block; font-size: 14.5px; font-weight: 620; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbar .title span { font-size: 13px; color: var(--muted); }
.timer { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; padding: 6px 10px; border-radius: 10px; background: var(--surface-2); }
.timer.low { color: var(--bad-ink); background: var(--bad-soft); }
.progress { height: 3px; background: var(--surface-2); }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.only-mobile { display: inline-flex; }
.only-desk { display: none; }
@media (min-width: 1000px) { .only-mobile { display: none !important; } .only-desk { display: inline-flex; } }

.tlayout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); padding-block: 18px 120px; }
@media (min-width: 1000px) { .tlayout { grid-template-columns: minmax(0, 1fr) 280px; padding-bottom: 40px; } }
.qcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
@media (min-width: 640px) { .qcard { padding: 28px 30px; } }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.qtext { font-size: 18px; line-height: 1.55; font-weight: 520; max-width: 68ch; overflow-wrap: anywhere; }
@media (min-width: 640px) { .qtext { font-size: 19.5px; } }
.qhint { margin-top: 12px; font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
.qhint svg { margin-top: 2px; }
.opts { display: grid; gap: 10px; margin-top: 20px; }
.opt {
  display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left;
  min-height: 56px; padding: 14px 16px; border-radius: 14px;
  background: var(--surface); border: 1.5px solid var(--border); color: var(--text);
  font-size: 15.5px; line-height: 1.45; overflow-wrap: anywhere;
  transition: border-color var(--dur), background var(--dur), box-shadow var(--dur), transform var(--dur);
}
.opt:hover:not([disabled]) { border-color: var(--border-strong); background: var(--surface-2); }
.opt[disabled] { cursor: default; }
.opt .lt {
  flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  font-size: 13px; font-weight: 650; background: var(--surface-2); color: var(--muted); margin-top: -2px;
  transition: background var(--dur), color var(--dur);
}
.opt.multi .lt { border-radius: 7px; }
.opt .ot { flex: 1; min-width: 0; padding-top: 1px; }
.opt .st { flex: none; margin-top: 1px; display: none; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .lt { background: var(--accent); color: var(--on-accent); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .lt { background: var(--ok); color: var(--surface); }
.opt.ok .st { display: block; color: var(--ok); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .lt { background: var(--bad); color: var(--surface); }
.opt.bad .st { display: block; color: var(--bad); }
.opt.miss { border-style: dashed; border-color: var(--ok); }
.opt.miss .st { display: block; color: var(--ok); }
.opt.dim { opacity: .62; }
.opt.pending.sel { border-color: var(--warn); background: var(--warn-soft); }
.opt.pending.sel .lt { background: var(--warn); color: var(--surface); }
.opt.pop { animation: pop .28s ease; }
@keyframes pop { 40% { transform: scale(1.012); } }
.opt.shake { animation: shake .32s ease; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

.fb { margin-top: 18px; padding: 14px 16px; border-radius: 14px; border: 1px solid; display: grid; gap: 6px; font-size: 14.5px; animation: rise .22s ease; }
.fb .h { display: flex; gap: 8px; align-items: center; font-weight: 650; }
.fb.ok { background: var(--ok-soft); border-color: var(--ok-border); color: var(--ok-ink); }
.fb.bad { background: var(--bad-soft); border-color: var(--bad-border); color: var(--bad-ink); }
.fb.warn { background: var(--warn-soft); border-color: var(--warn-border); color: var(--warn-ink); }
.fb.info { background: var(--surface-2); border-color: var(--border); color: var(--text); }
.fb .x { color: var(--text); opacity: .86; }
.fb .src { font-size: 12.5px; opacity: .8; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }
.qactions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

.rail { display: none; }
@media (min-width: 1000px) { .rail { display: block; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); } }
.navpanel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.navpanel h3 { font-size: 14px; display: flex; justify-content: space-between; margin-bottom: 12px; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; max-height: 46vh; overflow: auto; padding: 2px; }
.qb {
  position: relative; height: 38px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface);
  font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted);
}
.qb.ans { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
.qb.skip { background: var(--surface-2); color: var(--faint); border-style: dashed; border-color: var(--border-strong); }
.qb.chk { background: var(--warn-soft); color: var(--warn-ink); border-color: transparent; }
.qb.ok { background: var(--ok-soft); color: var(--ok-ink); border-color: transparent; }
.qb.bad { background: var(--bad-soft); color: var(--bad-ink); border-color: transparent; }
.qb.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.qb.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 14px; font-size: 12px; color: var(--muted); }

  // timer
  var timerId = null, lastTick = 0, tickN = 0;
  function startTimer() {

  /* =========================================================
     Results & review

  function viewResults() {

    var R = 60, C = 2 * Math.PI * R;

      '<circle class="fg ' + tone + '" id="ringfg" cx="74" cy="74" r="' + R + '" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - (c.gradable ? pct : 0) / 100)).toFixed(1) + '"/></svg>' +
      '<div class="c"><b>' + (c.gradable ? pct + '%' : '—') + '</b><span>' + (c.gradable ? c.correct + ' из ' + c.gradable : 'нет ключей') + '</span></div></div>' +
      '<div><div class="eyebrow">' + esc(a.title) + ' · ' + esc(fmtDate(a.finishedAt)) + (a.timeout ? ' · время вышло' : '') + '</div>' +

    h += '<div class="res-tiles">' +
      tile('acc', 'Отвечено', c.answered + '<small class="muted" style="font-size:14px"> / ' + c.total + '</small>') +
      tile('ok', 'Верно', c.correct) + tile('bad', 'Неверно', c.wrong) + tile('', 'Пропущено', c.skipped) +

      onChange: function (e) {
        if (e.target.id === 'imp-file' && e.target.files && e.target.files[0]) {
          var f = e.target.files[0];
          if (f.size > 15 * 1024 * 1024) { importError(['Файл больше 15 МБ — это не похоже на данные приложения.']); return; }
          var r = new FileReader();
          r.onload = function () { analyzeImport(String(r.result || '')); };
          r.onerror = function () { importError(['Не удалось прочитать файл.']); };
          r.readAsText(f);
        }
      },
      keep: true
    });
  }
  function importError(errs) {
    var m = document.getElementById('imp-msg');
    if (m) m.innerHTML = '<div class="fb bad"><div class="h">' + ic('x') + 'Импорт невозможен — данные не изменены</div><ul class="errs">' + errs.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>';
  }
  function analyzeImport(text) {
    text = String(text || '').trim();
    if (!text) { importError(['Выберите файл или вставьте текст.']); return; }
    var obj;
    try { obj = JSON.parse(text); } catch (e) { importError(['Это не JSON: ' + e.message]); return; }
    if (obj && obj.kind === 'sdx-backup') {
      if (!obj.progress || typeof obj.progress !== 'object') { importError(['В резервной копии нет раздела progress.']); return; }
      var p = cleanProgress(obj.progress), at = cleanAttempts(obj.attempts), uk = cleanKeys(obj.userKeys);
      var known = Object.keys(p.q).filter(function (id) { return DB.byId[id]; }).length;
      openModal({
        title: 'Восстановить прогресс?',
        body: '<p>Текущий прогресс на этом устройстве будет заменён данными из копии' + (obj.exportedAt ? ' от ' + esc(fmtDate(Date.parse(obj.exportedAt))) : '') + '.</p>' +
          '<dl class="kv"><dt>Вопросов с попытками</dt><dd>' + Object.keys(p.q).length + (known < Object.keys(p.q).length ? ' (в текущей базе: ' + known + ')' : '') + '</dd><dt>Попыток</dt><dd>' + at.length + '</dd><dt>Отметок</dt><dd>' + Object.keys(p.flags).length + '</dd><dt>Ваших ключей</dt><dd>' + Object.keys(uk).length + '</dd></dl>',
        actions: [{ label: 'Отмена', a: 'close' }, {
          label: 'Заменить прогресс', kind: 'primary', fn: function () {
            progress = p; attempts = at; userKeys = uk; saveProgress(); saveAttempts(); saveKeys();
            if (obj.settings && typeof obj.settings === 'object') { var cur = settings; store.set('settings', obj.settings); settings = loadSettings(); if (!settings) settings = cur; saveSettings(); applyTheme(); }
            closeModal(true); render(); toast('Прогресс восстановлен');
          }
        }]
      });
      return;
    }
    var r = validateBase(obj);
    if (!r.ok) { importError(r.errors.concat(r.moreErrors ? ['…и ещё ' + r.moreErrors + ' ' + plural(r.moreErrors, ['ошибка', 'ошибки', 'ошибок'])] : [])); return; }
    var newIds = {}; r.questions.forEach(function (q) { newIds[q.id] = 1; });
    var removed = DB.questions.filter(function (q) { return !newIds[q.id]; }).length;
    var added = r.questions.filter(function (q) { return !DB.byId[q.id]; }).length;
    var changedKeys = r.questions.filter(function (q) { var o = DB.byId[q.id]; return o && !sameSet(o.correct || [], q.correct || []); }).length;
    var keyed = r.questions.filter(isSourced).length;
    openModal({
      title: 'Заменить базу вопросов?',
      body: '<p>Структура проверена, ошибок нет. Прогресс сохранится: он привязан к id вопросов.</p>' +
        '<dl class="kv"><dt>Вопросов в файле</dt><dd>' + r.questions.length + '</dd><dt>С подтверждённым ответом</dt><dd>' + keyed + '</dd><dt>Новых</dt><dd>' + added + '</dd><dt>Исчезнут из текущей</dt><dd>' + removed + '</dd><dt>Изменён ключ</dt><dd>' + changedKeys + '</dd></dl>' +
        (session ? '<p>Незавершённый тест будет закрыт без сохранения результата.</p>' : ''),
      actions: [{ label: 'Отмена', a: 'close' }, {
        label: 'Заменить базу', kind: 'primary', fn: function () {
          var payload = { kind: 'sdx-questions', version: 1, importedAt: Date.now(), title: (obj && typeof obj.title === 'string') ? obj.title : null, questions: [] };
          payload.questions =r.questions.map(function (q) { return { id: q.id, num: q.num, question: q.question, options: q.options, correctAnswer: q.correct, answerStatus: q.status, explanation: q.explanation, source: q.source, sourceUrl: q.sourceUrl, note: q.note, tags: q.tags }; });
          if (!store.set('db', payload) && storageOk) return;
          DB = mkDb(r.questions, 'import', { importedAt: payload.importedAt, title: payload.title });
          session = null; saveSession();
          closeModal(true); render(); toast('База обновлена: ' + pn(r.questions.length, W_Q));
        }
      }]
    });
  }

  /* =========================================================
     Modal & toast
     ========================================================= */
  var modalRoot = document.getElementById('modal-root');
  var modalCfg = null, modalReturn = null;
  function openModal(cfg) {
    var reopening = !!modalCfg && cfg.keep && modalCfg.title === cfg.title;
    if (!modalCfg) modalReturn = document.activeElement;
    modalCfg = cfg;
    var actions = (cfg.actions || []).map(function (a, i) {
      return '<button class="btn ' + (a.kind || '') + '" data-ma="' + i + '"' + (a.disabled ? ' disabled' : '') + '>' + (a.icon ? ic(a.icon, 'sm') : '') + esc(a.label) + '</button>';
    }).join('');
    var bodyScroll = reopening ? ($('.mb', modalRoot) || {}).scrollTop : 0;
    modalRoot.innerHTML = '<div class="scrim"' + (reopening ? ' style="animation:none"' : '') + ' data-scrim="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"' + (reopening ? ' style="animation:none"' : '') + '>' +
      '<div class="mh"><h2 id="m-title">' + esc(cfg.title) + '</h2><button class="btn ghost sm icon" data-mclose="1" aria-label="Закрыть">' + ic('x') + '</button></div>' +
      '<div class="mb">' + (cfg.body || '') + '</div>' + (actions ? '<div class="mf">' + actions + '</div>' : '') + '</div></div>';
    if (reopening) { var mb = $('.mb', modalRoot); if (mb) mb.scrollTop = bodyScroll || 0; }
    else {
      var f = modalRoot.querySelector('.mf .btn.primary:not([disabled])') || modalRoot.querySelector('.mb input, .mb button, .mf .btn');
      if (f) try { f.focus({ preventScroll: true }); } catch (e) {}
    }
  }
  function closeModal(silent) {
    if (!modalCfg) return;
    modalCfg = null; modalRoot.innerHTML = '';
    if (!silent && modalReturn && document.contains(modalReturn)) try { modalReturn.focus(); } catch (e) {}
    modalReturn = null; setupState = null;
  }
  modalRoot.addEventListener('click', function (e) {
    if (!modalCfg) return;
    if (e.target.getAttribute && e.target.getAttribute('data-scrim')) { closeModal(); return; }
    if (e.target.closest('[data-mclose]')) { closeModal(); return; }
    var b = e.target.closest('[data-ma]');
    if (b) {
      var a = modalCfg.actions[+b.getAttribute('data-ma')];
      if (!a) return;
      if (a.fn) a.fn(); else if (a.a === 'close') closeModal(); else if (a.a && ACTIONS[a.a]) { closeModal(true); ACTIONS[a.a](b, e); }
      return;
    }
    var t = e.target.closest('[data-a]');
    if (t && ACTIONS[t.getAttribute('data-a')]) ACTIONS[t.getAttribute('data-a')](t, e);
  });
  modalRoot.addEventListener('change', function (e) {
    if (!modalCfg) return;
    if (modalCfg.onInput && (e.target.type === 'radio' || e.target.type === 'checkbox')) modalCfg.onInput(e);
    if (modalCfg.onChange) modalCfg.onChange(e);
  });
  modalRoot.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
    if (e.key === 'Tab') {
      var f = $$('button:not([disabled]), input:not([disabled]), textarea, [tabindex]:not([tabindex="-1"])', modalRoot);
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  var toastRoot = document.getElementById('toasts');
  function toast(msg) {
    if (!toastRoot) return;
    var el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
    toastRoot.appendChild(el);
    while (toastRoot.children.length > 3) toastRoot.removeChild(toastRoot.firstChild);
    setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 300); }, 2400);
  }

  /* =========================================================
     Actions (event delegation)
     ========================================================= */
  var ACTIONS = {
    home: function () { go('home'); },
    catalog: function () { ui.cat.filter = ui.cat.filter === 'hard' ? 'all' : ui.cat.filter; go('catalog'); },
    data: function () { go('data'); },
    theme: function () { settings.theme = settings.theme === 'system' ? 'light' : settings.theme === 'light' ? 'dark' : 'system'; saveSettings(); applyTheme(); render(); toast(settings.theme === 'system' ? 'Тема как в системе' : settings.theme === 'light' ? 'Светлая тема' : 'Тёмная тема'); },
    setup: function (t) { if (t.getAttribute('aria-disabled') === 'true') { toast('Ошибок пока нет — сначала пройдите тренировку'); return; } openSetup(t.getAttribute('data-mode')); },
    hardList: function () { go('catalog', { filter: 'hard' }); },
    resume: function () { closeModal(true); if (session) { ui.lastQ = null; go('test'); } },
    openAttempt: function (t) { go('results', { id: t.getAttribute('data-id') }); },
    openQ: function (t) { var id = t.getAttribute('data-id'); ui.cat.q = ''; ui.cat.filter = 'all'; ui.cat.open = {}; ui.cat.open[id] = 1; var q = DB.byId[id]; ui.cat.limit = Math.max(40, DB.questions.indexOf(q) + 1); go('catalog'); var el = document.getElementById('ci-' + id); if (el) el.scrollIntoView({ block: 'center' }); },
    // test
    pick: function (t) { pick(+t.getAttribute('data-o')); },
    check: function () { checkCurrent(); },
    prev: function () { move(-1); },
    next: function () { var s = session, id = s.qids[s.idx]; if (s.instant && isMulti(curQ()) && s.answers[id] && s.answers[id].length && !s.checked[id]) { checkCurrent(); return; } move(1); },
    skip: function () { skip(); },
    flag: function () { toggleFlag(session.qids[session.idx]); render(); },
    jump: function (t) { jump(+t.getAttribute('data-i')); },
    navSheet: function () {
      openModal({ title: 'Вопросы', body: '<div class="sheet-grid">' + navGrid() + '</div>', actions: [{ label: 'Завершить тест', fn: function () { closeModal(true); askFinish(); } }, { label: 'Закрыть', kind: 'primary', a: 'close' }] });
      var cur = modalRoot.querySelector('.qb.cur'); if (cur) try { cur.focus(); cur.scrollIntoView({ block: 'nearest' }); } catch (e) {}
    },
    finish: function () { askFinish(); },
    exit: function () { askExit(); },
    // results
    resFilter: function (t) { ui.res.filter = t.getAttribute('data-f'); ui.res.open = {}; render(); var r = document.getElementById('review'); if (r && t.closest('.actions')) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
    resToggle: function (t) { var id = t.getAttribute('data-id'); if (ui.res.open[id]) delete ui.res.open[id]; else ui.res.open[id] = 1; render(); },
    repeatWrong: function () {
      var a = attempts.filter(function (x) { return x.id === ui.res.id; })[0]; if (!a) return;
      var ids = a.items.filter(function (i) { return i.st === 'w' && DB.byId[i.id]; }).map(function (i) { return i.id; });
      if (!ids.length) return;
      beginSession('mistakes', shuffle(ids), { instant: true, shuffleO: true, shuffleQ: true, timer: 0, count: 0 }, 'Повтор ошибок');
    },
    again: function () {
      var a = attempts.filter(function (x) { return x.id === ui.res.id; })[0]; if (!a) return;
      if (MODES[a.mode] && settings.setup[a.mode]) openSetup(a.mode);
      else { var ids = a.items.map(function (i) { return i.id; }).filter(function (id) { return DB.byId[id]; }); beginSession(a.mode, a.cfg && a.cfg.shuffleQ ? shuffle(ids) : ids, a.cfg || { instant: true }, a.title); }
    },
    flagQ: function (t) { toggleFlag(t.getAttribute('data-id')); if (ui.view === 'catalog') rerenderCatList(); else render(); },
    // catalog
    catFilter: function (t) { ui.cat.filter = t.getAttribute('data-f'); ui.cat.limit = 40; ui.cat.edit = null; render(); },
    catClear: function () { ui.cat.q = ''; render(); var i = document.getElementById('cat-q'); if (i) i.focus(); },
    catMore: function () { ui.cat.limit += 40; rerenderCatList(); },
    catToggle: function (t) { var id = t.getAttribute('data-id'); if (ui.cat.open[id]) { delete ui.cat.open[id]; if (ui.cat.edit === id) ui.cat.edit = null; } else ui.cat.open[id] = 1; rerenderCatList(); var b = document.querySelector('#ci-' + CSS.escape(id) + ' .head'); if (b) b.focus(); },
    catReveal: function (t) { var id = t.getAttribute('data-id'); if (ui.cat.reveal[id]) delete ui.cat.reveal[id]; else ui.cat.reveal[id] = 1; rerenderCatList(); },
    catTrain: function () {
      var ids = catResults().map(function (q) { return q.id; }).slice(0, 100);
      if (!ids.length) return;
      beginSession(ui.cat.filter === 'hard' ? 'hard' : 'custom', shuffle(ids), { instant: true, shuffleQ: true, shuffleO: false, timer: 0, count: 0 }, ui.cat.filter === 'hard' ? 'Сложные вопросы' : 'Тренировка по списку');
    },
    solveOne: function (t) { var id = t.getAttribute('data-id'); beginSession('custom', [id], { instant: true, timer: 0 }, 'Вопрос №' + DB.byId[id].num); },
    editKey: function (t) { var id = t.getAttribute('data-id'); ui.cat.edit = id; ui.cat.editSel = (userKeys[id] || []).slice(); rerenderCatList(); },
    editPick: function (t) { var o = +t.getAttribute('data-o'), s = ui.cat.editSel, p = s.indexOf(o); if (p >= 0) s.splice(p, 1); else s.push(o); rerenderCatList(); },
    editCancel: function () { ui.cat.edit = null; rerenderCatList(); },
    editSave: function (t) { var id = t.getAttribute('data-id'); if (!ui.cat.editSel.length) return; userKeys[id] = ui.cat.editSel.slice().sort(); saveKeys(); ui.cat.edit = null; ui.cat.reveal[id] = 1; rerenderCatList(); toast('Ключ сохранён — вопрос теперь проверяется'); },
    delKey: function (t) {
      var id = t.getAttribute('data-id');
      openModal({ title: 'Удалить ваш ключ?', body: '<p>Вопрос №' + DB.byId[id].num + ' снова станет вопросом без подтверждённого ответа.</p>', actions: [{ label: 'Отмена', a: 'close' }, { label: 'Удалить', kind: 'danger', fn: function () { delete userKeys[id]; saveKeys(); closeModal(true); rerenderCatList(); toast('Ключ удалён'); } }] });
    },
    // data
    exportBackup: function () { exportModal(backupObj(), 'stomatologia-progress-' + new Date().toISOString().slice(0, 10) + '.json', 'Экспорт прогресса'); },
    exportBase: function () { exportModal(baseObj(), 'stomatologia-questions.json', 'Экспорт базы вопросов'); },
    importOpen: function () { openImport(); },
    resetBase: function () {
      openModal({ title: 'Вернуть встроенную базу?', body: '<p>Импортированная база будет удалена. Прогресс по совпадающим вопросам сохранится.</p>', actions: [{ label: 'Отмена', a: 'close' }, { label: 'Вернуть', kind: 'primary', fn: function () { store.del('db'); DB = loadDb(); session = loadSession(); closeModal(true); render(); toast('Встроенная база восстановлена'); } }] });
    },
    resetAll: function () {
      openModal({
        title: 'Удалить весь прогресс?', body: '<p>Статистика, история попыток, отметки, ваши ключи и незавершённый тест будут удалены с этого устройства. Отменить это нельзя. Если сомневаетесь, сначала сделайте экспорт.</p>',
        actions: [{ label: 'Отмена', a: 'close' }, { label: 'Удалить прогресс', kind: 'danger', fn: function () { progress = cleanProgress(null); attempts = []; userKeys = {}; session = null; ['progress', 'attempts', 'keys', 'session'].forEach(store.del); closeModal(true); render(); toast('Прогресс удалён'); } }]
      });
    }
  };

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-a]');
    if (!t || t.disabled) return;
    var fn = ACTIONS[t.getAttribute('data-a')];
    if (fn) fn(t, e);
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'cat-q') {
      ui.cat.q = e.target.value; ui.cat.limit = 40;
      clearTimeout(app._st);
      app._st = setTimeout(function () {
        rerenderCatList();
        var clr = $('.search .clr', app);
        if (!!ui.cat.q !== !!clr) { var pos = e.target.selectionStart; render(); var inp = document.getElementById('cat-q'); if (inp) { inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (er) {} } }
      }, 120);
    }
  });
  app.addEventListener('change', function (e) {
    if (e.target.name === 'theme') { settings.theme = e.target.value; saveSettings(); applyTheme(); render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (modalCfg || ui.view !== 'test' || !session) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || e.metaKey || e.ctrlKey || e.altKey) return;
    var q = curQ(), order = session.optOrder[q.id];
    var n = LETTERS.indexOf(e.key.toUpperCase());
    if (n >= 0 && n < order.length && /^[1-9]$/.test(e.key)) { e.preventDefault(); pick(order[n]); var b = app.querySelector('[data-fk="opt-' + n + '"]'); if (b && !b.disabled) b.focus(); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); ACTIONS.next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); if (session.instant && isMulti(q) && !session.checked[q.id]) checkCurrent(); else if (session.idx === session.qids.length - 1) askFinish(); else move(1); }
    else if (e.key.toLowerCase() === 'm' || e.key.toLowerCase() === 'ь') { e.preventDefault(); ACTIONS.flag(); }
    else if (e.key.toLowerCase() === 's' || e.key.toLowerCase() === 'ы') { var b2 = app.querySelector('[data-a="skip"]'); if (b2 && !b2.disabled) { e.preventDefault(); skip(); } }
  });
  window.addEventListener('scroll', function () { var t = document.getElementById('top'); if (t) t.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });

  function afterRender() {
    if (ui.view === 'test' && session) startTimer(); else stopTimer();
    if (ui.view === 'results') {
      var fg = document.getElementById('ringfg');
      if (fg && !fg.dataset.done) {
        var final = fg.getAttribute('stroke-dashoffset'); fg.dataset.done = '1';
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !ui.res.animated) {
          ui.res.animated = true;
          fg.style.transition = 'none'; fg.setAttribute('stroke-dashoffset', fg.getAttribute('stroke-dasharray'));
          fg.getBoundingClientRect(); fg.style.transition = '';
          requestAnimationFrame(function () { fg.setAttribute('stroke-dashoffset', final); });
        }
      }
    }
  }

  // hash entry points (bare tokens only)
  var hash = (location.hash || '').replace('#', '');
  if (hash === 'catalog' || hash === 'questions') ui.view = 'catalog';
  else if (hash === 'data') ui.view = 'data';

  applyTheme();
  render(true);
  window.__sdx = { get session() { return session; }, get progress() { return progress; }, get attempts() { return attempts; }, DB: function () { return DB; } };

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.documentElement.hasAttribute('data-pwa')) {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  }
})();

</script>
</body>
